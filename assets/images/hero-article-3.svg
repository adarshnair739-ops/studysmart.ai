<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="art3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFEA"/>
      <stop offset="100%" stop-color="#EAE1D4"/>
    </linearGradient>
    <filter id="scaleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A3A38" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="20" fill="url(#art3Grad)"/>
  
  <circle cx="400" cy="240" r="180" fill="#E8DFD2" opacity="0.4"/>

  <!-- Editorial Scale of Academic Balance -->
  <g transform="translate(400, 80)" filter="url(#scaleShadow)">
    <!-- Base & Pillar -->
    <path d="M-60 310 L60 310 L45 285 L-45 285 Z" fill="#3A3A38"/>
    <rect x="-6" y="30" width="12" height="260" rx="4" fill="#3A3A38"/>
    <circle cx="0" cy="30" r="14" fill="#7C8F7A"/>
    <circle cx="0" cy="30" r="6" fill="#FAF8F5"/>

    <!-- Balance Crossbar (Horizontal balance) -->
    <rect x="-190" y="26" width="380" height="8" rx="4" fill="#3A3A38"/>

    <!-- Left Scale (Benefits: Tutoring, Accessibility, Efficiency) -->
    <line x1="-160" y1="34" x2="-220" y2="130" stroke="#7C8F7A" stroke-width="2"/>
    <line x1="-160" y1="34" x2="-100" y2="130" stroke="#7C8F7A" stroke-width="2"/>
    <path d="M-240 130 Q-160 170 -80 130 Z" fill="#EFF3EF" stroke="#7C8F7A" stroke-width="2"/>
    
    <!-- Left Scale Content Box -->
    <g transform="translate(-215, 145)" filter="url(#scaleShadow)">
      <rect width="110" height="70" rx="8" fill="#FFFFFF" stroke="#D1E0D1" stroke-width="1.5"/>
      <text x="55" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#7C8F7A" text-anchor="middle">PROS</text>
      <text x="55" y="42" font-family="'Inter', sans-serif" font-size="9" fill="#3A3A38" text-anchor="middle">24/7 Tutoring</text>
      <text x="55" y="56" font-family="'Inter', sans-serif" font-size="9" fill="#3A3A38" text-anchor="middle">Accessibility</text>
    </g>

    <!-- Right Scale (Risks: Cognitive Atrophy, Hallucinations, Integrity) -->
    <line x1="160" y1="34" x2="100" y2="130" stroke="#7C8F7A" stroke-width="2"/>
    <line x1="160" y1="34" x2="220" y2="130" stroke="#7C8F7A" stroke-width="2"/>
    <path d="M80 130 Q160 170 240 130 Z" fill="#FBF7F0" stroke="#7C8F7A" stroke-width="2"/>

    <!-- Right Scale Content Box -->
    <g transform="translate(105, 145)" filter="url(#scaleShadow)">
      <rect width="110" height="70" rx="8" fill="#FFFFFF" stroke="#E5DDD2" stroke-width="1.5"/>
      <text x="55" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#995E4F" text-anchor="middle">CONS</text>
      <text x="55" y="42" font-family="'Inter', sans-serif" font-size="9" fill="#3A3A38" text-anchor="middle">Over-Reliance</text>
      <text x="55" y="56" font-family="'Inter', sans-serif" font-size="9" fill="#3A3A38" text-anchor="middle">Honor Code Risks</text>
    </g>
  </g>

  <!-- Bottom Banner: The Balanced Student Framework -->
  <g transform="translate(240, 400)" filter="url(#scaleShadow)">
    <rect width="320" height="50" rx="10" fill="#FFFFFF" stroke="#7C8F7A" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="10" fill="#7C8F7A"/>
    <path d="M21 25L24 28L29 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="45" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#3A3A38">The Human-in-the-Loop Standard</text>
    <text x="45" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#7C8F7A">AI as a thinking partner, not a surrogate writer</text>
  </g>
</svg>
