<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="art2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E8E0D2"/>
    </linearGradient>
    <filter id="art2Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A3A38" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="20" fill="url(#art2Grad)"/>
  
  <!-- Subtle circular waves representing spaced repetition retention curves -->
  <path d="M100 360 C 250 200, 450 340, 700 180" stroke="#7C8F7A" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity="0.4"/>
  <path d="M100 400 C 250 260, 480 380, 700 240" stroke="#D5CCC1" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Left Card: Socratic Prompt & Brainstorm -->
  <g transform="translate(110, 100)" filter="url(#art2Shadow)">
    <rect width="250" height="280" rx="16" fill="#FFFFFF" stroke="#E5DDD2" stroke-width="1.5"/>
    <!-- Card header -->
    <rect x="24" y="24" width="110" height="22" rx="6" fill="#EFF3EF"/>
    <text x="34" y="39" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#7C8F7A">ACTIVE RECALL</text>
    
    <text x="24" y="80" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#3A3A38">Socratic Prompt</text>
    <rect x="24" y="98" width="202" height="68" rx="8" fill="#FAF8F5" stroke="#EAE4DC" stroke-width="1"/>
    <text x="36" y="120" font-family="'Inter', sans-serif" font-size="11" fill="#6B6760">"Do not give me the answer.</text>
    <text x="36" y="136" font-family="'Inter', sans-serif" font-size="11" fill="#6B6760">Quiz me on the Krebs cycle</text>
    <text x="36" y="152" font-family="'Inter', sans-serif" font-size="11" fill="#6B6760">step-by-step..."</text>

    <!-- Feedback Pill -->
    <rect x="24" y="184" width="202" height="74" rx="8" fill="#EFF3EF" stroke="#D2DFD2" stroke-width="1"/>
    <circle cx="44" cy="204" r="10" fill="#7C8F7A"/>
    <path d="M40 204L43 207L49 201" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="208" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#3A3A38">Retention Boost: +84%</text>
    <text x="62" y="228" font-family="'Inter', sans-serif" font-size="10" fill="#5E705C">Deep cognitive engagement</text>
    <text x="62" y="242" font-family="'Inter', sans-serif" font-size="10" fill="#5E705C">vs passive re-reading</text>
  </g>

  <!-- Central Connection Node / Synapse -->
  <g transform="translate(380, 210)">
    <circle cx="20" cy="20" r="28" fill="#7C8F7A" filter="url(#art2Shadow)"/>
    <!-- Lightning / Insight icon -->
    <path d="M22 8L12 22L19 22L17 32L28 18L21 18Z" fill="#FAF8F5"/>
  </g>

  <!-- Right Card: Feynman Technique & Spaced Planner -->
  <g transform="translate(440, 100)" filter="url(#art2Shadow)">
    <rect width="250" height="280" rx="16" fill="#FFFFFF" stroke="#E5DDD2" stroke-width="1.5"/>
    <rect x="24" y="24" width="135" height="22" rx="6" fill="#F4EFEA"/>
    <text x="34" y="39" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B6760">FEYNMAN METHOD</text>

    <text x="24" y="80" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#3A3A38">Concept Simplifier</text>
    
    <!-- Step 1 to 3 Visual -->
    <g transform="translate(24, 102)">
      <circle cx="10" cy="12" r="10" fill="#7C8F7A"/>
      <text x="7" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="28" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#3A3A38">Deconstruct core principle</text>
    </g>
    <g transform="translate(24, 142)">
      <circle cx="10" cy="12" r="10" fill="#7C8F7A"/>
      <text x="6" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="28" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#3A3A38">Identify knowledge gaps</text>
    </g>
    <g transform="translate(24, 182)">
      <circle cx="10" cy="12" r="10" fill="#7C8F7A"/>
      <text x="6" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="28" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#3A3A38">Generate real analogies</text>
    </g>

    <rect x="24" y="222" width="202" height="36" rx="6" fill="#F5EFE6"/>
    <text x="44" y="244" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6B6760">Active Testing > Re-reading</text>
  </g>
</svg>
