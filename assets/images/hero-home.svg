<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFEA"/>
      <stop offset="100%" stop-color="#EBE3D8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C8F7A"/>
      <stop offset="100%" stop-color="#5E705C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A3A38" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid & background accents -->
  <circle cx="120" cy="90" r="70" fill="#E2D9CC" opacity="0.4"/>
  <circle cx="700" cy="380" r="110" fill="#D8CFBF" opacity="0.3"/>
  
  <!-- Central Desk / Composition Floor -->
  <ellipse cx="400" cy="410" rx="340" ry="24" fill="#DACFBF" opacity="0.6"/>

  <!-- Open Textbook on Left -->
  <g transform="translate(180, 260)" filter="url(#softShadow)">
    <!-- Book Spine & Pages -->
    <path d="M0,70 Q70,55 140,65 L140,0 Q70,-10 0,0 Z" fill="#FFFFFF"/>
    <path d="M140,65 Q210,55 280,70 L280,0 Q210,-10 140,0 Z" fill="#FAF8F5"/>
    <!-- Book Cover Spine -->
    <path d="M-6,74 Q70,59 140,69 Q210,59 286,74 L284,80 Q210,65 140,75 Q70,65 -4,80 Z" fill="#7C8F7A"/>
    <!-- Text Lines -->
    <line x1="25" y1="20" x2="115" y2="20" stroke="#D5CCC1" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="32" x2="105" y2="32" stroke="#D5CCC1" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="44" x2="120" y2="44" stroke="#D5CCC1" stroke-width="3" stroke-linecap="round"/>
    <line x1="165" y1="20" x2="255" y2="20" stroke="#D5CCC1" stroke-width="3" stroke-linecap="round"/>
    <line x1="165" y1="32" x2="245" y2="32" stroke="#D5CCC1" stroke-width="3" stroke-linecap="round"/>
    <line x1="165" y1="44" x2="260" y2="44" stroke="#D5CCC1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Laptop / AI Interface in Center -->
  <g transform="translate(370, 160)" filter="url(#softShadow)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="260" height="170" rx="10" fill="#3A3A38"/>
    <!-- Display -->
    <rect x="10" y="10" width="240" height="150" rx="6" fill="#FAF8F5"/>
    <!-- Screen Header Bar -->
    <rect x="10" y="10" width="240" height="24" rx="4" fill="#EFE9DF"/>
    <circle cx="26" cy="22" r="3.5" fill="#D5CCC1"/>
    <circle cx="36" cy="22" r="3.5" fill="#D5CCC1"/>
    <circle cx="46" cy="22" r="3.5" fill="#7C8F7A"/>
    <rect x="65" y="17" width="90" height="10" rx="3" fill="#FFFFFF"/>
    <!-- AI Chat Prompts & Responses on Screen -->
    <rect x="25" y="46" width="130" height="20" rx="5" fill="#E8E2D7"/>
    <rect x="32" y="52" width="100" height="8" rx="3" fill="#8C8880"/>
    
    <rect x="65" y="76" width="170" height="55" rx="6" fill="#EFF3EF" stroke="#D0DDD0" stroke-width="1"/>
    <line x1="78" y1="90" x2="215" y2="90" stroke="#7C8F7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="102" x2="195" y2="102" stroke="#7C8F7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="114" x2="170" y2="114" stroke="#7C8F7A" stroke-width="3" stroke-linecap="round"/>

    <!-- Keyboard Base -->
    <path d="M-25,170 L285,170 L265,195 L-5,195 Z" fill="#DCD4C7"/>
    <!-- Trackpad -->
    <rect x="105" y="176" width="50" height="14" rx="3" fill="#CCC3B4"/>
  </g>

  <!-- Floating Intelligent Cards / AI Nodes -->
  <g transform="translate(140, 110)" filter="url(#softShadow)">
    <rect width="130" height="74" rx="12" fill="#FFFFFF" stroke="#E9E2D8" stroke-width="1.5"/>
    <circle cx="30" cy="28" r="14" fill="#EFF3EF"/>
    <path d="M25 28L28 31L35 24" stroke="#7C8F7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="22" width="60" height="8" rx="3" fill="#3A3A38"/>
    <rect x="25" y="48" width="80" height="6" rx="3" fill="#D5CCC1"/>
  </g>

  <g transform="translate(560, 80)" filter="url(#softShadow)">
    <rect width="140" height="84" rx="12" fill="#FFFFFF" stroke="#E9E2D8" stroke-width="1.5"/>
    <!-- Sparkle symbol -->
    <path d="M32 20L34 27L41 29L34 31L32 38L30 31L23 29L30 27Z" fill="#7C8F7A"/>
    <rect x="54" y="24" width="70" height="8" rx="3" fill="#3A3A38"/>
    <rect x="26" y="48" width="98" height="6" rx="3" fill="#D5CCC1"/>
    <rect x="26" y="58" width="65" height="6" rx="3" fill="#E9E2D8"/>
  </g>

  <!-- Neural Synthesis Connections -->
  <path d="M270,147 C320,130 360,170 390,180" stroke="#7C8F7A" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M560,122 C510,120 480,150 460,170" stroke="#7C8F7A" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="390" cy="180" r="4" fill="#7C8F7A"/>
  <circle cx="460" cy="170" r="4" fill="#7C8F7A"/>

  <!-- Coffee Cup / Study Companion -->
  <g transform="translate(680, 290)" filter="url(#softShadow)">
    <rect x="0" y="20" width="36" height="42" rx="6" fill="#FFFFFF" stroke="#E2DACD" stroke-width="1.5"/>
    <!-- Handle -->
    <path d="M36 28 C46 28 46 48 36 50" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <path d="M36 28 C46 28 46 48 36 50" stroke="#E2DACD" stroke-width="1.5" fill="none"/>
    <ellipse cx="18" cy="20" rx="18" ry="6" fill="#8C7662"/>
    <!-- Steam -->
    <path d="M12 12 Q14 6 10 2" stroke="#D5CCC1" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M22 10 Q24 4 20 0" stroke="#D5CCC1" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
